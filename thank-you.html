<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Confirmed | Nuvyza</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f7f3ee;color:#111}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:620px;background:#fff;padding:48px;border-radius:18px;box-shadow:0 12px 40px #00000012;text-align:center}.tick{font-size:54px}.btn{display:inline-block;margin-top:20px;background:#111;color:#fff;padding:14px 24px;border-radius:8px;text-decoration:none;font-weight:700;border:0;cursor:pointer;font-size:15px}.cancel{background:#fff;color:#b42318;border:1px solid #b42318;margin-left:8px}.cancel:disabled{opacity:.55;cursor:not-allowed}.muted{color:#666;line-height:1.7}.order{font-size:20px;font-weight:800;background:#f4efe9;padding:14px;border-radius:8px;margin:20px 0}.status{margin-top:16px;font-weight:700;line-height:1.5}@media(max-width:520px){.card{padding:32px 20px}.btn{display:block;width:100%;margin:10px 0 0}.cancel{margin-left:0}}</style></head>
<body><div class="wrap"><div class="card"><div class="tick">✓</div><h1>Order Confirmed</h1><p>Thank you for shopping with Nuvyza.</p><div class="order">Order Number: <span id="orderNo"></span></div><p class="muted">Your Cash on Delivery order has been received. We will contact you on the phone number provided to confirm delivery details.</p><a class="btn" href="/">Continue Shopping</a><button class="btn cancel" id="cancelBtn" onclick="cancelOrder()">Cancel Order</button><div class="status" id="cancelStatus"></div></div></div><script>const API='https://script.google.com/macros/s/AKfycbz1jjudDkOkIXsLaNl37CGh83hMbfoFTOOhvE0eEogzRr3qfLsu2GSc5VBar01DXbaD5w/exec';const order=new URLSearchParams(location.search).get('order')||'';document.getElementById('orderNo').textContent=order||'N/A';async function cancelOrder(){if(!order){cancelStatus.textContent='Order number not found.';return}if(!confirm('Are you sure you want to cancel this order?'))return;cancelBtn.disabled=true;cancelBtn.textContent='Cancelling...';cancelStatus.textContent='';try{const r=await fetch(API+'?action=cancel&order='+encodeURIComponent(order));const d=await r.json();if(d.success){cancelStatus.textContent='Your order has been cancelled successfully.';cancelBtn.textContent='Order Cancelled';}else{cancelStatus.textContent=d.message||'Unable to cancel order.';cancelBtn.disabled=false;cancelBtn.textContent='Cancel Order';}}catch(e){cancelStatus.textContent='Unable to cancel order. Please contact Nuvyza support.';cancelBtn.disabled=false;cancelBtn.textContent='Cancel Order';}}</script></body></html>
